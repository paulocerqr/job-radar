<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block titulo %}Job Radar{% endblock %} · Job Radar</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="/">Job <span>Radar</span></a>
      {% if usuario %}
      <nav class="abas" aria-label="Seções">
        <span class="aba desligada" title="Em breve">Triagem</span>
        <a class="aba {% if aba == 'perfil' %}ativa{% endif %}" href="/perfil">Perfil &amp; Regras</a>
        <span class="aba desligada" title="Em breve">Coletores</span>
        <span class="aba desligada" title="Em breve">Providers</span>
      </nav>
      <form method="post" action="/sair" class="sair">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <span class="quem">{{ usuario.nome }}</span>
        <button class="botao fantasma pequeno" type="submit">Sair</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
