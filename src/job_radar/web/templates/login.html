{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao login">
  <h1>Entrar</h1>
  {% if erro %}<p class="alerta erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/login" class="pilha">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button class="botao primario" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
