name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  testes:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teste -d teste"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teste:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  imagem:
    needs: testes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps (k8s-lab, docs/13-argocd.md): com a imagem publicada, aponta o lab para ela.
  # O Argo CD percebe o commit no k8s-lab e faz migração + rollout.
  atualizar-lab:
    needs: imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # deploy key com escrita só no k8s-lab (secret K8S_LAB_DEPLOY_KEY)
      - uses: actions/checkout@v7
        with:
          repository: paulocerqr/k8s-lab
          ssh-key: ${{ secrets.K8S_LAB_DEPLOY_KEY }}
          path: k8s-lab
      - name: newTag → ${{ github.sha }}
        working-directory: k8s-lab
        run: |
          arquivo=apps/job-radar/kustomization.yaml
          sed -Ei "s/^(    newTag: )[0-9a-f]{40}/\1${GITHUB_SHA}/" "$arquivo"
          if git diff --quiet; then echo "o lab já está em ${GITHUB_SHA}"; exit 0; fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: job-radar → ${GITHUB_SHA::7}" \
            -m "Imagem ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA} publicada pelo CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # outro push no k8s-lab no meio do caminho: rebase e tenta de novo
          for tentativa in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
